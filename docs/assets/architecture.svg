<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
<title id="title">Codock architecture</title><desc id="desc">Phone and desktop connect through HTTPS to Codock. Chat reads the original Codex history; input reaches the original tmux. Previews have a separate origin. An SSH reverse tunnel is optional when the gateway is on another machine.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#a9b8d8"/></marker></defs>
<rect width="1080" height="360" rx="24" fill="#1b1f2b"/>
<g font-family="system-ui,sans-serif"><text x="32" y="42" fill="#b9c2d8" font-size="13" letter-spacing="2">ONE SESSION. FOUR WAYS TO STAY CONNECTED.</text>
<g fill="#252c3c" stroke="#495670"><rect x="30" y="133" width="150" height="88" rx="14"/><rect x="232" y="133" width="160" height="88" rx="14"/><rect x="445" y="114" width="182" height="125" rx="14"/><rect x="742" y="76" width="300" height="68" rx="14"/><rect x="742" y="164" width="300" height="68" rx="14"/><rect x="742" y="252" width="300" height="68" rx="14"/></g>
<g fill="#e4e9f4" font-size="18" text-anchor="middle"><text x="105" y="172">Browser</text><text x="312" y="172">HTTPS / WSS</text><text x="536" y="157" font-weight="700">Codock</text><text x="892" y="104">Original Codex history</text><text x="892" y="192">Original tmux + Codex</text><text x="892" y="280">HTML / media / local app</text></g>
<g fill="#aab6cd" font-size="12" text-anchor="middle"><text x="105" y="197">Phone + desktop</text><text x="312" y="197">Nginx gateway</text><text x="536" y="183">Auth · chat · terminal</text><text x="536" y="205">One user / one instance</text><text x="892" y="126">Read-only adapter</text><text x="892" y="214">Explicit input and approvals</text><text x="892" y="302">Authenticated, separate origin</text><text x="432" y="283">Different machine? Add a restricted reverse SSH tunnel.</text></g>
<g fill="none" stroke="#a9b8d8" stroke-width="2" marker-end="url(#a)"><path d="M184 177h43"/><path d="M396 177h43"/><path d="M631 151h41v-41h64"/><path d="M631 177h42v21h63"/><path d="M631 203h40v84h65"/></g>
</g></svg>
