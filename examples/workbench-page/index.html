<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>项目预览示例</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.7 system-ui;
      background: #181c25;
      color: #e0e5f0;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 780px;
      margin: auto;
      padding: 32px 20px;
    }
    section {
      border: 1px solid #3b4559;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      background: #242c3b;
    }
    button {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #91a9d4;
      background: #354769;
      color: white;
      font: inherit;
      margin: 5px 5px 5px 0;
    }
    .night {
      background: #10131c;
    }
    small {
      color: #b1bbcf;
    }
    a {
      color: #b6cfff;
    }
  </style>
  <main>
    <small>CODEX WORKBENCH / PREVIEW EXAMPLE</small>
    <h1>从终端到手机，直接查看成果。</h1>
    <p>
      这是一个自包含的 HTML 示例，不需要额外端口或外部 CDN。绑定后，网页和媒体经过同一登录身份授权。
    </p>
    <section>
      <h2>交互检查</h2>
      <p>已执行 <strong id="count">0</strong> 次操作。</p>
      <button id="hello">运行演示</button><button id="mode" aria-pressed="false">切换背景</button>
      <p id="bubble" role="status">点击按钮，确认预览可交互。</p>
    </section>
    <section>
      <h2>下一步</h2>
      <p>
        在这个目录放入报告、图片和 H.264 MP4
        视频，使用相对链接连接资源。不要把密钥、数据库或整个项目根目录放进展示目录。
      </p>
      <p>演示不会执行服务器命令，也不会创建或修改 tmux。</p>
    </section>
  </main>
  <script>
    let count = 0;
    document.querySelector("#hello").onclick = () => {
      document.querySelector("#count").textContent = ++count;
      document.querySelector("#bubble").textContent = "交互正常，可以继续展示项目成果。";
    };
    document.querySelector("#mode").onclick = (e) => {
      const value = document.body.classList.toggle("night");
      e.currentTarget.setAttribute("aria-pressed", String(value));
    };
  </script>
</html>
